<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Araba Hasar Seçici (Bootstrap)</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Vue 3 (Global Build) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
  <div id="app" class="bg-light min-vh-100 d-flex flex-column">
    <header class="border-bottom py-3 px-3 bg-white">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col">
            <h1 class="h4 fw-bold mb-0">Araba Hasar Seçici</h1>
          </div>
          <div class="col-auto">
            <div class="d-flex gap-3 flex-wrap text-secondary small align-items-center">
              <span><span class="badge rounded-pill bg-success">Orijinal</span></span>
              <span><span class="badge rounded-pill bg-info text-dark">Boyalı</span></span>
              <span><span class="badge rounded-pill bg-danger">Değişen</span></span>
              
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-grow-1 py-4">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8">
            <div class="position-relative bg-white border rounded-4 shadow-sm p-3 mb-4" style="min-height:340px;">
              <div v-if="loading" class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center text-secondary text-center" style="z-index:2; background:rgba(255,255,255,.7);">
                <div class="spinner-border text-secondary mb-2" role="status"></div>
                <div>car.svg yükleniyor…<br><small class="text-muted">Tıklanacak öğelere <code>class="part"</code> vermen önerilir.</small></div>
              </div>
              <div id="svgHost" ref="svgHost" aria-live="polite" class="w-100 d-flex justify-content-center align-items-center" style="min-height:320px;"></div>
            </div>
            <div class="d-flex justify-content-end mb-3">
              <button class="btn btn-outline-primary" @click="resetAllToOriginal">Sıfırla</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="border-top py-2 px-3 bg-white text-muted small text-center">
      İpucu: Klavyede <strong>Enter</strong>/<strong>Space</strong> ile de parça durumunu değiştirebilirsin. (Önce parçaya odaklan)
    </footer>
  </div>

  <script>
  (() => {
    const { createApp, reactive, onMounted, ref } = Vue;

    // ------- Basit, genişletilebilir Logger (SOLID: tek sorumluluk) -------
    function createLogger(sink = console){
      const buffer = [];
      const push = (level, type, data = {}) => {
        const entry = { ts: new Date().toISOString(), level, type, ...data };
        buffer.push(entry);
        if (sink && typeof sink[level] === 'function') sink[level](`[${type}]`, entry);
      };
      return Object.freeze({
        info: (type, data) => push('info',  type, data),
        warn: (type, data) => push('warn',  type, data),
        error:(type, data) => push('error', type, data),
        get:  () => buffer.slice(),
        clear:() => { buffer.length = 0; }
      });
    }
    const logger = createLogger();
    // Dış sistemlerle entegrasyon için global'e koyduk (isteğe bağlı)
    window.damageLogger = logger;

    logger.info('APP_START', { message: 'Uygulama başlıyor' });

    // --- State sabitleri ---
    const STATES = Object.freeze({
      ORIGINAL:  'original',
      PAINTED:   'painted',
      REPLACED:  'replaced',
    });
    const ORDER = [STATES.ORIGINAL, STATES.PAINTED, STATES.REPLACED];

    // ---- Pure fonksiyonlar (fonksiyonel, test edilebilir) ----
    function nextState(prev){
      // Döngü: null -> original -> painted -> replaced -> original...
      if (!prev) return ORDER[0];
      const idx = ORDER.indexOf(prev);
      if (idx === -1) return ORDER[0];
      return ORDER[(idx + 1) % ORDER.length];
    }
    // Bootstrap renkleriyle SVG parça durumunu uygula
    function classFor(state){
      if (state === STATES.ORIGINAL) return 'border-success';
      if (state === STATES.PAINTED)  return 'border-info';
      if (state === STATES.REPLACED) return 'border-danger';
      return '';
    }
    function applyStateClass(el, state){
      el.classList.remove('border-success','border-info','border-danger');
      // Dolgu için Bootstrap'in arka plan renkleri
      el.style.strokeWidth = '1';
      if (state === STATES.ORIGINAL) {
        el.style.stroke = '#198754'; // Bootstrap success
        el.style.fill = 'rgba(25,135,84,0.18)';
      } else if (state === STATES.PAINTED) {
        el.style.stroke = '#0dcaf0'; // Bootstrap info
        el.style.fill = 'rgba(13,202,240,0.18)';
      } else if (state === STATES.REPLACED) {
        el.style.stroke = '#dc3545'; // Bootstrap danger
        el.style.fill = 'rgba(220,53,69,0.18)';
      } else {
        el.style.stroke = '';
        el.style.fill = '';
      }
      el.setAttribute('aria-pressed', state ? 'true' : 'false');
    }
    function normalizePart(el, idGen){
      if (!el.id) el.id = 'parca-' + idGen();
      el.classList.add('part');
      el.setAttribute('tabindex', '0');
      el.setAttribute('role', 'button');
      el.setAttribute('aria-pressed', 'false');
      const fill = el.getAttribute('fill');
      if (!fill || fill === 'none') el.setAttribute('selected-transparent', '1');
    }
    function findPartElement(node, svgRoot){
      const isShape = n => n && n.matches && n.matches('path,polygon,rect,circle,ellipse,polyline');
      const isPart  = n => n && n.classList && n.classList.contains('part');
      let cur = node;
      while (cur && cur !== svgRoot && cur.nodeType === 1){
        if (isPart(cur)) return cur;
        if (isShape(cur)) return cur;
        cur = cur.parentNode;
      }
      return null;
    }

    createApp({
      setup(){
        const svgHost = ref(null);
        const stage   = ref(null);
        const loading = ref(true);

        // reaktif durum: id -> 'original' | 'painted' | 'replaced'
        const model = reactive({
          parts: new Map(),   // id -> element
          values: new Map(),  // id -> state string
        });

        let __id = 1;
        const nextId = () => __id++;

        onMounted(async () => {
          try{
            const svg = await loadInlineSVG('car.svg');
            loading.value = false;
            svgHost.value.appendChild(svg);
            logger.info('SVG_LOADED', { message: 'SVG eklendi' });

            // parçaları topla & normalize et
            const registered = prepareParts(svg, model, nextId);
            logger.info('PARTS_REGISTERED', { count: registered });

            // *** İSTENEN: DOM yüklenir yüklenmez hepsi ORİJİNAL ***
            initAllToOriginal(model);

            // tıklama: durum döngüsü
            svg.addEventListener('click', (ev) => {
              const target = findPartElement(ev.target, svg);
              if (!target) return;
              const id = target.id;
              const prev = model.values.get(id);
              const next = nextState(prev);
              model.values.set(id, next);
              applyStateClass(target, next);
              logger.info('PART_STATE_CHANGED', { id, from: prev, to: next, by: 'click' });
            });

            // klavye: Enter/Space
            svg.addEventListener('keydown', (ev) => {
              if (ev.key !== 'Enter' && ev.key !== ' ') return;
              const target = findPartElement(ev.target, svg);
              if (!target) return;
              ev.preventDefault();
              const id = target.id;
              const prev = model.values.get(id);
              const next = nextState(prev);
              model.values.set(id, next);
              applyStateClass(target, next);
              logger.info('PART_STATE_CHANGED', { id, from: prev, to: next, by: 'keyboard' });
            });

          }catch(err){
            console.error(err);
            loading.value = false;
            svgHost.value.innerHTML = `<div class="empty">car.svg yüklenemedi.<br><small class="muted">Dosyayı bir yerel sunucuda açın veya SVG’yi inline gömün.</small></div>`;
            logger.error('SVG_LOAD_FAILED', { reason: err.message });
          }
        });

        function resetAllToOriginal(){
          let changed = 0;
          model.values.forEach((_, id) => {
            const el = model.parts.get(id);
            if (!el) return;
            const prev = model.values.get(id);
            if (prev !== STATES.ORIGINAL) {
              model.values.set(id, STATES.ORIGINAL);
              applyStateClass(el, STATES.ORIGINAL);
              changed++;
            }
          });
          logger.info('RESET_TO_ORIGINAL', { changed });
        }

        // başlangıç seti
        function initAllToOriginal(model){
          let count = 0;
          model.parts.forEach((el, id) => {
            model.values.set(id, STATES.ORIGINAL);
            applyStateClass(el, STATES.ORIGINAL);
            count++;
          });
          logger.info('INITIALIZED_TO_ORIGINAL', { count });
        }

        return { svgHost, stage, loading, resetAllToOriginal };
      }
    }).mount('#app');

    // ----- Yardımcılar -----
    async function loadInlineSVG(url){
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      const text = await res.text();
      const doc  = new DOMParser().parseFromString(text, 'image/svg+xml');
      const svg  = doc.documentElement;
      if (!svg.getAttribute('viewBox')){
        const w = parseFloat(svg.getAttribute('width')) || 1200;
        const h = parseFloat(svg.getAttribute('height')) || 600;
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      }
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.setAttribute('aria-label', 'Araba diyagramı');
      return svg;
    }

    function prepareParts(svgRoot, model, idGen){
      let nodes = svgRoot.querySelectorAll('.part');
      if (!nodes.length){
        nodes = svgRoot.querySelectorAll('path,polygon,rect,circle,ellipse,polyline');
      }
      let registered = 0;
      nodes.forEach(el => {
        const cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.visibility === 'hidden') return;
        normalizePart(el, idGen);
        model.parts.set(el.id, el);
        registered++;
      });
      return registered;
    }
  })();
  </script>
</body>
</html>
