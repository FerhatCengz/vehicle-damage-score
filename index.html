<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Araba Hasar Seçici (Vue + Logging + Default=Orijinal)</title>

  <!-- Vue 3 (Global Build) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <style>
    :root{
      /* Statik renk paleti — ihtiyaç olduğunda burayı değiştir */
      --color-original: #16a34a;          /* Orijinal */
      --color-original-weak: rgba(22,163,74,.22);

      --color-painted:  #0ea5e9;          /* Boyalı */
      --color-painted-weak:  rgba(14,165,233,.22);

      --color-replaced: #ef4444;          /* Değişen */
      --color-replaced-weak: rgba(239,68,68,.22);

      --bg1: #0b0d10; --bg2: #12161c; --border: #1f2833; --muted:#94a3b8; --text:#e6ebf2;
    }
    html, body { height: 100%; }
    body{
      margin:0; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color: var(--text);
      background: radial-gradient(1200px 600px at 30% -10%, #141a22 0%, #0b0d10 60%);
    }
    header{
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    }
    header h1{ font-size:18px; margin:0; font-weight:600; letter-spacing:.2px; }
    .legend{ display:flex; gap:14px; color:var(--muted); font-size:13px; align-items:center; flex-wrap:wrap; }
    .dot{ width:14px; height:14px; border-radius:50%; display:inline-block; border:2px solid currentColor; }
    .dot.original{ color: var(--color-original); background: var(--color-original-weak); }
    .dot.painted{ color: var(--color-painted); background: var(--color-painted-weak); }
    .dot.replaced{ color: var(--color-replaced); background: var(--color-replaced-weak); }

    .wrap{ padding: 16px; max-width: 1200px; margin: 0 auto; }
    .stage{
      position:relative; display:grid; place-items:center; min-height:360px;
      background: linear-gradient(180deg, #0f141b, #0b0d10); border:1px solid var(--border);
      border-radius:12px; padding: clamp(10px, 2.5vw, 20px);
    }
    .stage svg{ width:min(100%, 1000px); height:auto; display:block; }
    .empty{
      position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:var(--muted); pointer-events:none; padding:18px;
    }
    .tools{ display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }
    .btn{
      appearance:none; border:1px solid var(--border); background:#0f1520; color:var(--text);
      padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:600;
    }
    .btn:hover{ background:#121a28; border-color:#2a3647; }
    .btn:active{ transform: translateY(1px); }

    /* Parça etkileşimi */
    .part{ cursor:pointer; outline:none; transition: filter .15s ease; }
    .part:hover{ filter: drop-shadow(0 0 10px rgba(160,200,255,.35)); }

    /* Durum sınıfları — sadece bu sınıflar uygulanır */
    .state-original{ stroke: var(--color-original) !important; stroke-width:2 !important; fill: var(--color-original-weak) !important; }
    .state-painted{  stroke: var(--color-painted)  !important; stroke-width:2 !important; fill: var(--color-painted-weak)  !important; }
    .state-replaced{ stroke: var(--color-replaced) !important; stroke-width:2 !important; fill: var(--color-replaced-weak) !important; }

    /* Saydam parçada da dolgu uygula */
    .part[selected-transparent="1"].state-original{ fill: var(--color-original-weak) !important; }
    .part[selected-transparent="1"].state-painted{  fill: var(--color-painted-weak)  !important; }
    .part[selected-transparent="1"].state-replaced{ fill: var(--color-replaced-weak) !important; }

    footer{ color:var(--muted); font-size:12px; padding:10px 16px; border-top:1px solid var(--border); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Araba Hasar Seçici</h1>
      <div class="legend">
        <span><span class="dot original"></span> Orijinal</span>
        <span><span class="dot painted"></span> Boyalı</span>
        <span><span class="dot replaced"></span> Değişen</span>
        <span class="muted">• Parçaya tıkla → Orijinal → Boyalı → Değişen → Orijinal…</span>
      </div>
    </header>

    <main class="wrap">
      <section class="stage" ref="stage">
        <div class="empty" v-if="loading">car.svg yükleniyor…<br><small class="muted">Tıklanacak öğelere <code>class="part"</code> vermen önerilir.</small></div>
        <div id="svgHost" ref="svgHost" aria-live="polite"></div>
      </section>

      <div class="tools">
        <button class="btn" @click="resetAllToOriginal">Hepsini Orijinal Yap</button>
      </div>
    </main>

    <footer>
      İpucu: Klavyede <strong>Enter</strong>/<strong>Space</strong> ile de parça durumunu değiştirebilirsin. (Önce parçaya odaklan)
    </footer>
  </div>

  <script>
  (() => {
    const { createApp, reactive, onMounted, ref } = Vue;

    // ------- Basit, genişletilebilir Logger (SOLID: tek sorumluluk) -------
    function createLogger(sink = console){
      const buffer = [];
      const push = (level, type, data = {}) => {
        const entry = { ts: new Date().toISOString(), level, type, ...data };
        buffer.push(entry);
        if (sink && typeof sink[level] === 'function') sink[level](`[${type}]`, entry);
      };
      return Object.freeze({
        info: (type, data) => push('info',  type, data),
        warn: (type, data) => push('warn',  type, data),
        error:(type, data) => push('error', type, data),
        get:  () => buffer.slice(),
        clear:() => { buffer.length = 0; }
      });
    }
    const logger = createLogger();
    // Dış sistemlerle entegrasyon için global'e koyduk (isteğe bağlı)
    window.damageLogger = logger;

    logger.info('APP_START', { message: 'Uygulama başlıyor' });

    // --- State sabitleri ---
    const STATES = Object.freeze({
      ORIGINAL:  'original',
      PAINTED:   'painted',
      REPLACED:  'replaced',
    });
    const ORDER = [STATES.ORIGINAL, STATES.PAINTED, STATES.REPLACED];

    // ---- Pure fonksiyonlar (fonksiyonel, test edilebilir) ----
    function nextState(prev){
      // Döngü: null -> original -> painted -> replaced -> original...
      if (!prev) return ORDER[0];
      const idx = ORDER.indexOf(prev);
      if (idx === -1) return ORDER[0];
      return ORDER[(idx + 1) % ORDER.length];
    }
    function classFor(state){
      if (state === STATES.ORIGINAL) return 'state-original';
      if (state === STATES.PAINTED)  return 'state-painted';
      if (state === STATES.REPLACED) return 'state-replaced';
      return '';
    }
    function applyStateClass(el, state){
      el.classList.remove('state-original','state-painted','state-replaced');
      const cls = classFor(state);
      if (cls) el.classList.add(cls);
      el.setAttribute('aria-pressed', cls ? 'true' : 'false');
    }
    function normalizePart(el, idGen){
      if (!el.id) el.id = 'parca-' + idGen();
      el.classList.add('part');
      el.setAttribute('tabindex', '0');
      el.setAttribute('role', 'button');
      el.setAttribute('aria-pressed', 'false');
      const fill = el.getAttribute('fill');
      if (!fill || fill === 'none') el.setAttribute('selected-transparent', '1');
    }
    function findPartElement(node, svgRoot){
      const isShape = n => n && n.matches && n.matches('path,polygon,rect,circle,ellipse,polyline');
      const isPart  = n => n && n.classList && n.classList.contains('part');
      let cur = node;
      while (cur && cur !== svgRoot && cur.nodeType === 1){
        if (isPart(cur)) return cur;
        if (isShape(cur)) return cur;
        cur = cur.parentNode;
      }
      return null;
    }

    createApp({
      setup(){
        const svgHost = ref(null);
        const stage   = ref(null);
        const loading = ref(true);

        // reaktif durum: id -> 'original' | 'painted' | 'replaced'
        const model = reactive({
          parts: new Map(),   // id -> element
          values: new Map(),  // id -> state string
        });

        let __id = 1;
        const nextId = () => __id++;

        onMounted(async () => {
          try{
            const svg = await loadInlineSVG('car.svg');
            loading.value = false;
            svgHost.value.appendChild(svg);
            logger.info('SVG_LOADED', { message: 'SVG eklendi' });

            // parçaları topla & normalize et
            const registered = prepareParts(svg, model, nextId);
            logger.info('PARTS_REGISTERED', { count: registered });

            // *** İSTENEN: DOM yüklenir yüklenmez hepsi ORİJİNAL ***
            initAllToOriginal(model);

            // tıklama: durum döngüsü
            svg.addEventListener('click', (ev) => {
              const target = findPartElement(ev.target, svg);
              if (!target) return;
              const id = target.id;
              const prev = model.values.get(id);
              const next = nextState(prev);
              model.values.set(id, next);
              applyStateClass(target, next);
              logger.info('PART_STATE_CHANGED', { id, from: prev, to: next, by: 'click' });
            });

            // klavye: Enter/Space
            svg.addEventListener('keydown', (ev) => {
              if (ev.key !== 'Enter' && ev.key !== ' ') return;
              const target = findPartElement(ev.target, svg);
              if (!target) return;
              ev.preventDefault();
              const id = target.id;
              const prev = model.values.get(id);
              const next = nextState(prev);
              model.values.set(id, next);
              applyStateClass(target, next);
              logger.info('PART_STATE_CHANGED', { id, from: prev, to: next, by: 'keyboard' });
            });

          }catch(err){
            console.error(err);
            loading.value = false;
            svgHost.value.innerHTML = `<div class="empty">car.svg yüklenemedi.<br><small class="muted">Dosyayı bir yerel sunucuda açın veya SVG’yi inline gömün.</small></div>`;
            logger.error('SVG_LOAD_FAILED', { reason: err.message });
          }
        });

        function resetAllToOriginal(){
          let changed = 0;
          model.values.forEach((_, id) => {
            const el = model.parts.get(id);
            if (!el) return;
            const prev = model.values.get(id);
            if (prev !== STATES.ORIGINAL) {
              model.values.set(id, STATES.ORIGINAL);
              applyStateClass(el, STATES.ORIGINAL);
              changed++;
            }
          });
          logger.info('RESET_TO_ORIGINAL', { changed });
        }

        // başlangıç seti
        function initAllToOriginal(model){
          let count = 0;
          model.parts.forEach((el, id) => {
            model.values.set(id, STATES.ORIGINAL);
            applyStateClass(el, STATES.ORIGINAL);
            count++;
          });
          logger.info('INITIALIZED_TO_ORIGINAL', { count });
        }

        return { svgHost, stage, loading, resetAllToOriginal };
      }
    }).mount('#app');

    // ----- Yardımcılar -----
    async function loadInlineSVG(url){
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      const text = await res.text();
      const doc  = new DOMParser().parseFromString(text, 'image/svg+xml');
      const svg  = doc.documentElement;
      if (!svg.getAttribute('viewBox')){
        const w = parseFloat(svg.getAttribute('width')) || 1200;
        const h = parseFloat(svg.getAttribute('height')) || 600;
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      }
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.setAttribute('aria-label', 'Araba diyagramı');
      return svg;
    }

    function prepareParts(svgRoot, model, idGen){
      let nodes = svgRoot.querySelectorAll('.part');
      if (!nodes.length){
        nodes = svgRoot.querySelectorAll('path,polygon,rect,circle,ellipse,polyline');
      }
      let registered = 0;
      nodes.forEach(el => {
        const cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.visibility === 'hidden') return;
        normalizePart(el, idGen);
        model.parts.set(el.id, el);
        registered++;
      });
      return registered;
    }
  })();
  </script>
</body>
</html>
